<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的岗位库</title>
<link rel="stylesheet" href="/shell.css">
<style>
 html,body{overflow:hidden}
 body{padding:0}
 .app{display:flex;flex-direction:column;height:100vh}
 .top{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:14px 24px;
   border-bottom:1px solid var(--line);background:var(--surface)}
 .top h1{margin:0;font-size:15px;font-weight:600}
 .top .dbp{font-family:var(--mono);font-size:10.5px;color:var(--dim2)}
 .top .sp{margin-left:auto;display:flex;gap:12px;align-items:center}
 /* ⚠️ 页面本身**不滚**。之前是「页面滚 + 左列表滚(6699px) + 右内容滚」
    三层嵌套,鼠标在左列表上滚到底就会把外层页面一起带走 ——
    手感发黏、像卡住。现在只有左右两栏各自滚,一个位置只有一个滚动容器。 */
 .scroll{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;
   padding:14px 20px 0;overflow:hidden}
 .wrap{max-width:1180px;margin:0 auto;width:100%;flex:1 1 auto;
   display:flex;flex-direction:column;min-height:0}
 h2{font-size:12px;font-weight:600;color:var(--dim);letter-spacing:.4px;margin:26px 0 4px}
 h2:first-of-type{margin-top:0}
 .lead{font-size:11.5px;color:var(--dim2);line-height:1.65;margin:0 0 12px}
 .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;
   margin-bottom:10px;flex:0 0 auto}
 .fact{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:8px 12px}
 .fact b{display:block;font-family:var(--mono);font-size:17px;font-weight:600;color:var(--fg);line-height:1.15}
 .fact span{font-size:10.5px;color:var(--dim2)}
 .fact.warn{border-color:var(--warn-line);background:var(--warn-dim)}
 .fact.warn b{color:var(--warn-text)}
 .fact.on{border-color:var(--ok-line);background:var(--ok-dim)}
 .fact.on b{color:var(--ok)}
 .box{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
 table{width:100%;border-collapse:collapse;font-size:12.5px}
 th{text-align:left;font-size:10px;font-weight:500;color:var(--dim2);letter-spacing:.6px;
   padding:9px 12px;background:#0f1217;border-bottom:1px solid var(--line);white-space:nowrap}
 td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
 tr:last-child td{border-bottom:0}
 td.n{text-align:right;font-family:var(--mono);color:var(--accent-text);white-space:nowrap}
 td.t{font-family:var(--mono);font-size:11px;color:var(--dim2);white-space:nowrap}
 .pill{display:inline-block;font-size:10px;padding:1.5px 6px;border-radius:5px;
   border:1px solid var(--line);color:var(--dim2)}
 .pill.have{border-color:var(--ok-line);background:var(--ok-dim);color:var(--ok)}
 .pill.warn{border-color:var(--warn-line);background:var(--warn-dim);color:var(--warn-text)}
 .btn{background:var(--surface2,#1a1f27);border:1px solid var(--line);border-radius:8px;
   padding:7px 13px;color:var(--fg);font-size:12px;cursor:pointer}
 .btn:hover:not(:disabled){border-color:var(--accent-line)}
 .btn:disabled{opacity:.45;cursor:default}
 .btn.go{background:var(--accent-dim,#1c2740);border-color:var(--accent-line)}
 .msg{font-size:11.5px;line-height:1.6;margin-top:10px;padding:9px 12px;border-radius:8px;
   border:1px solid var(--line);background:var(--bg);display:none}
 .msg.ok{border-color:var(--ok-line);background:var(--ok-dim);color:var(--ok)}
 .msg.bad{border-color:var(--warn-line);background:var(--warn-dim);color:var(--warn-text)}
 .empty{padding:26px 20px;text-align:center;color:var(--dim);font-size:12px;line-height:1.8}
 a.lk{color:var(--accent-text);text-decoration:none;font-size:12px}
 a.lk:hover{text-decoration:underline}

 /* ── 岗位库:左列表 + 右内容 ── */
 .lib{display:flex;flex:1 1 auto;min-height:0;margin-bottom:12px}
 .lb-l{flex:0 0 320px;display:flex;flex-direction:column;border-right:1px solid var(--line);min-width:0}
 /* 左栏两个标签:岗位 / 待提取 —— 待提取从页面下方搬进来,页面因此不用滚 */
 .tabs{display:flex;border-bottom:1px solid var(--line);background:#0f1217;flex:0 0 auto}
 .tabs button{flex:1;width:auto;text-align:center;background:transparent;border:0;
   border-bottom:2px solid transparent;border-radius:0;padding:9px 6px;margin:0;
   color:var(--dim2);font-size:11.5px;cursor:pointer}
 .tabs button.on{color:var(--accent-text);border-bottom-color:var(--accent)}
 .tabs button:hover:not(.on){color:var(--dim)}
 .lsearch{display:flex;gap:6px;padding:10px;border-bottom:1px solid var(--line);background:#0f1217}
 .lsearch input{flex:1;min-width:0;background:var(--bg);color:var(--fg);border:1px solid var(--line);
   border-radius:8px;padding:7px 10px;font-size:12px;font-family:inherit}
 .lsearch input:focus{outline:none;border-color:var(--accent-line)}
 .lsearch .btn{padding:6px 10px;font-size:11.5px;white-space:nowrap}
 .lnote{font-size:10px;color:var(--dim2);padding:6px 12px;border-bottom:1px solid var(--line);
   line-height:1.5}
 .lnote:empty{display:none}
 .jlist{flex:1;overflow-y:auto}
 .jrow{padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}
 .jrow:hover{background:rgba(76,141,255,.05)}
 .jrow.on{background:var(--accent-dim);box-shadow:inset 2px 0 0 var(--accent)}
 .jrow .t{font-size:12.5px;color:var(--fg);line-height:1.4;display:flex;gap:8px;align-items:baseline}
 .jrow .t span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .jrow .fit{font-family:var(--mono);font-size:12px;color:var(--accent-text)}
 .jrow .sc{font-family:var(--mono);font-size:10px;color:var(--violet-text)}
 .jrow .m{font-size:10.5px;color:var(--dim2);margin-top:2px;overflow:hidden;
   text-overflow:ellipsis;white-space:nowrap}
 .lb-r{flex:1;overflow-y:auto;padding:16px 18px;min-width:0}

 /* 右侧内容排版:一层一层来,不挤在一行 */
 .jp h3{margin:0 0 10px;font-size:16px;font-weight:600;line-height:1.4}
 .kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:4px}
 .kv>div{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
 .kv b{display:block;font-size:12.5px;font-weight:500;color:var(--fg);line-height:1.35;
   overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .kv b.acc{color:var(--accent-text);font-family:var(--mono)}
 .kv span{font-size:9.5px;color:var(--dim2)}
 .sec{font-size:10.5px;color:var(--dim2);letter-spacing:.4px;margin:16px 0 7px;font-weight:600}
 .chips{display:flex;flex-wrap:wrap;gap:6px}
 .chip{font-size:11px;font-family:var(--mono);padding:3px 8px;border-radius:6px;
   border:1px solid var(--line2);background:var(--bg);color:var(--dim)}
 .chip.f{border-color:var(--accent-line);background:var(--accent-dim);color:var(--accent-text)}
 .jd{font-size:12.5px;color:var(--fg);line-height:1.85;white-space:pre-wrap;
   background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:13px 15px}
 .mrow{display:flex;gap:12px;align-items:center;margin-top:14px;padding:11px 14px;
   border:1px solid var(--accent-line);border-radius:10px;background:var(--accent-dim)}
 .mrow .fitn{font-family:var(--mono);font-size:22px;font-weight:600;color:var(--accent-text)}
 .jfoot{display:flex;gap:14px;align-items:center;margin-top:14px;flex-wrap:wrap;
   font-size:10.5px;color:var(--dim2)}

 /* 待提取 */
 td.ck{width:26px;text-align:center}
 input[type=checkbox]{accent-color:var(--accent)}
 .bar{display:flex;gap:10px;align-items:center;padding:10px 12px;background:#0f1217;
   border-bottom:1px solid var(--line);flex-wrap:wrap}
 .bar .eta{font-size:11px;color:var(--dim);font-family:var(--mono)}
 .bar .eta b{color:var(--accent-text)}
 /* AI 设置 */
 .alab{display:block;font-size:10px;color:var(--dim2);margin-bottom:3px}
 .ainp{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;
   padding:7px 10px;font-size:12px;font-family:inherit;min-width:120px}
 .ainp:focus{outline:none;border-color:var(--accent-line)}
</style>

<div class="app">
  <div class="top">
    <h1>我的岗位库</h1>
    <span class="dbp" id="db"></span>
    <div class="sp">
      <a class="lk" href="/me.html">我的简历</a>
      <a class="lk" href="/match.html">岗位匹配</a>
      <span class="pill" id="ai" style="cursor:pointer" title="点开配置 AI 模型">AI …</span>
    </div>
  </div>

  <div class="scroll"><div class="wrap">
    <div class="facts" id="facts"></div>

    <div class="box" id="aicard" style="display:none;margin-top:12px;padding:14px 16px">
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">
        <div><label class="alab">供应商</label><select id="aprov" class="ainp"></select></div>
        <div style="flex:1;min-width:200px"><label class="alab" id="akeylab">API Key</label>
          <input id="akey" class="ainp" type="password" placeholder="粘这家的 key;留空 = 不改" style="width:100%;box-sizing:border-box"></div>
        <div><label class="alab">模型(留空用默认)</label><input id="amodel" class="ainp" placeholder="默认"></div>
        <div><label class="alab">快档(提取/匹配)</label><input id="afast" class="ainp" placeholder="qwen-flash"></div>
        <button class="btn" id="atest">测一下</button>
        <button class="btn go" id="asave">保存</button>
      </div>
      <div class="msg" id="amsg" style="margin-top:10px"></div>
    </div>

    <p class="lead" style="margin:0 0 8px;flex:0 0 auto">左边挑、右边看 ——
      搜索框是**语义过滤**(按意思筛,不是关键词);「待提取」标签里勾选后点提取,
      清洗完自动转向量。<span id="msgline"></span></p>
    <div class="box lib">
      <div class="lb-l">
        <div class="tabs">
          <button id="tabJobs" class="on">岗位 <span id="nJobs"></span></button>
          <button id="tabPend">待提取 <span id="nPend"></span></button>
        </div>
        <div class="lsearch" id="searchbar">
          <input id="q" placeholder="语义过滤:远程 AI 岗 / 要音视频的…">
          <button class="btn go" id="qgo">过滤</button>
        </div>
        <div class="lnote" id="lnote"></div>
        <div class="jlist" id="jlist"><div class="empty">读取中…</div></div>
        <!-- 待提取的操作条:切到那个标签才出现 -->
        <div class="bar" id="pbar" style="display:none;border-top:1px solid var(--line);border-bottom:0">
          <label style="font-size:11px;color:var(--dim);display:flex;gap:5px;align-items:center">
            <input type="checkbox" id="ckall" checked> 全选</label>
          <button class="btn go" id="extract" style="margin-left:auto;padding:6px 10px;font-size:11.5px">提取</button>
          <span class="eta" id="eta" style="flex:0 0 100%"></span>
        </div>
      </div>
      <div class="lb-r" id="jpane">
        <div class="empty">左边挑一个岗位,这里显示清洗后的全部内容。<br>
          「匹配」有分的是模型已经分析过的;没分的点进「完整对照」让它跑一次。</div>
      </div>
    </div>

  </div></div>
</div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g,
  m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const bold = t => esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
document.querySelectorAll('.lead').forEach(e => e.innerHTML = bold(e.textContent));

function msg(id, t, cls) {
  // #msg 那块已经从页面上撤了(页面不滚,没地方摆)——提取的结果写到标题行
  if (id === '#msg') {
    const line = $('#msgline');
    if (line) {
      line.innerHTML = t ? ' · <b style="color:var(--' + (cls === 'bad' ? 'warn-text' : cls === 'ok' ? 'ok' : 'dim') + ')">' + bold(t) + '</b>' : '';
    }
    return;
  }
  const m = $(id);
  m.style.display = t ? 'block' : 'none';
  m.className = 'msg ' + (cls || ''); m.innerHTML = bold(t || '');
}

/* ══ 岗位库:左列表 + 右内容 ══════════════════════════════ */
const WM = {remote: '全职远程', hybrid: '混合办公', onsite: '现场办公'};
const VD = {worth: '值得投', maybe: '可以试试', skip: '别浪费'};
let CUR = null;          // 右侧正在看的 job_id
let FILTERED = false;    // 过滤中就别让 5 秒刷新把列表冲掉
let listSig = '';

function rowHtml(j, score) {
  return `<div class="jrow${j.job_id === CUR ? ' on' : ''}" data-id="${esc(j.job_id)}">
    <div class="t"><span>${esc(j.title || '(无标题)')}</span>
      ${score != null ? `<span class="sc">${score.toFixed(3)}</span>` : ''}
      ${j.fit != null ? `<span class="fit">${j.fit}</span>` : ''}</div>
    <div class="m">${esc(j.company || '')} · ${esc(j.city || '')} · ${esc(j.salary_text || j.salary || '')}${
      j.jd_state === 'have' ? '' : ' · 没JD'}</div>
  </div>`;
}

function bindRows() {
  document.querySelectorAll('#jlist .jrow').forEach(el => el.onclick = () => {
    CUR = el.dataset.id;
    document.querySelectorAll('#jlist .jrow').forEach(r =>
      r.classList.toggle('on', r.dataset.id === CUR));
    renderPane(CUR);
  });
}

function drawList(items, note) {
  $('#lnote').innerHTML = note || '';
  $('#jlist').innerHTML = items.length
    ? items.map(j => rowHtml(j, j._score)).join('')
    : '<div class="empty">这里还没有岗位。<br>开着插件侧边栏逛 BOSS,岗位自动进库。</div>';
  bindRows();
}

async function renderPane(id) {
  const pane = $('#jpane');
  pane.innerHTML = '<div class="empty">读取中…</div>';
  let d;
  try { d = await (await fetch('/api/boss/job/' + encodeURIComponent(id))).json(); }
  catch (e) { pane.innerHTML = '<div class="empty">读不到本地服务</div>'; return; }
  if (d.error) { pane.innerHTML = `<div class="empty">${esc(d.error)}</div>`; return; }
  if (id !== CUR) return;                    // 已经点了别的,别渲染旧的
  const j = d.job;

  // 基本信息:一格一项,不挤成一行 —— 「乱」就是从一行长串来的
  const kv = [
    [j.company, '公司'], [j.city + (j.district ? '·' + j.district : ''), '城市'],
    [j.salary_text || '未写', '薪资', 'acc'],
    [j.experience || '未写', '经验要求'], [j.degree || '未写', '学历要求'],
  ];
  if (j.job_state === 'closed') kv.push(['已关闭', '岗位状态']);
  const acts = (d.interactions || []).map(i =>
    `${{saved: '已收藏', applied: '投递', chatted: '沟通', viewed: '浏览'}[i.kind] || i.kind}${
      i.status && i.status !== 'unknown' ? '·' + i.status : ''}`).join(' / ');
  if (acts) kv.push([acts, '我和它']);

  const feat = [];
  if (WM[j.work_mode]) feat.push(WM[j.work_mode]);
  if (j.domain) feat.push(j.domain);
  for (const x of (j.stack || [])) feat.push(x);
  if (j.sell) feat.push('✦ ' + j.sell);

  const tags = j.tags || [];
  pane.innerHTML = `<div class="jp">
    <h3>${esc(j.title || '(无标题)')}</h3>
    <div class="kv">${kv.map(([v, k, c]) =>
      `<div><b class="${c || ''}" title="${esc(v)}">${esc(v)}</b><span>${k}</span></div>`).join('')}</div>

    ${d.match
      ? `<div class="mrow"><span class="fitn">${d.match.fit}</span>
           <span class="pill">${VD[d.match.verdict] || d.match.verdict || ''}</span>
           <span style="font-size:10.5px;color:var(--dim)">模型给的匹配分(已缓存,不会自己变)</span>
           <a class="lk" style="margin-left:auto" href="/match.html#${esc(j.job_id)}">完整对照 →</a></div>`
      : `<div class="mrow" style="border-color:var(--line);background:var(--bg)">
           <span style="font-size:11.5px;color:var(--dim)">还没让模型分析过这个岗位</span>
           <a class="lk" style="margin-left:auto" href="/match.html#${esc(j.job_id)}">AI 分析匹配 →</a></div>`}

    ${feat.length ? `<div class="sec">归纳特征(AI 清洗时提的,也进了向量)</div>
      <div class="chips">${feat.map(f => `<span class="chip f">${esc(f)}</span>`).join('')}</div>` : ''}

    <div class="sec">职位描述${j.jd_state === 'have' ? '(原文,未改写)' : ''}</div>
    ${j.jd ? `<div class="jd">${esc(j.jd)}</div>`
      : `<div class="jd" style="color:var(--dim2)">还没抓到职位描述 ——
         列表页看到的没有 JD;开着插件点进它的详情页就会自动补上。</div>`}

    ${tags.length ? `<div class="sec">页面上出现过的技能词(${tags.length} 个)</div>
      <div class="chips">${tags.slice(0, 40).map(t => `<span class="chip">${esc(t)}</span>`).join('')}${
        tags.length > 40 ? `<span class="chip">+${tags.length - 40}</span>` : ''}</div>` : ''}

    <div class="jfoot">
      ${j.url ? `<a class="lk" href="${esc(j.url)}" target="_blank" rel="noreferrer">看原页 ↗</a>` : ''}
      <span>存入 ${esc((j.first_seen || '').slice(0, 10))}</span>
      <span>更新 ${esc((j.updated_at || '').replace('T', ' ').slice(5, 16))}</span>
    </div>
  </div>`;
}

/* ── 语义过滤:结果进同一个左列表,清空恢复 ── */
async function doFilter() {
  const q = $('#q').value.trim();
  if (!q) {                                  // 清空 = 回到全部
    FILTERED = false; listSig = '';
    $('#lnote').innerHTML = '';
    load();
    return;
  }
  const b = $('#qgo'); b.disabled = true; b.textContent = '过滤中…';
  $('#lnote').innerHTML = '语义检索中…(第一次要加载向量模型,约 10 秒)';
  try {
    const d = await (await fetch('/api/boss/search?q=' + encodeURIComponent(q) + '&limit=20')).json();
    if (d.error) {
      $('#lnote').innerHTML = `<span style="color:var(--warn-text)">${esc(d.error)}</span>`;
      return;
    }
    FILTERED = true;
    const hs = (d.good || []).concat(d.maybe || []);
    // 同一个岗位可能命中多个片段 —— 按 job_id 去重,留分数最高的那条
    const seen = new Map();
    for (const h of hs) if (!seen.has(h.job_id)) seen.set(h.job_id, h);
    const items = [...seen.values()].map(h => ({
      job_id: h.job_id, title: h.title, company: h.company, city: h.city,
      salary: h.salary, jd_state: h.jd_state, fit: h.fit, _score: h.score,
    }));
    drawList(items,
      `过滤:「${esc(q)}」→ ${items.length} 个岗位` +
      ((d.good || []).length ? '' : '(全部只是「可能相关」档)') +
      ' · <a class="lk" id="qclear" style="cursor:pointer">清除,回到全部</a>');
    document.getElementById('qclear').onclick = () => { $('#q').value = ''; doFilter(); };
  } catch (e) {
    $('#lnote').innerHTML = `<span style="color:var(--warn-text)">出错:${esc(e.message)}</span>`;
  } finally { b.disabled = false; b.textContent = '过滤'; }
}
$('#qgo').onclick = doFilter;
$('#q').onkeydown = e => { if (e.key === 'Enter') doFilter(); };

/* ══ 待提取:进左栏标签,列表区共用 ══════════════════════ */
let PEND = [], TAB = 'jobs';

function setTab(t) {
  TAB = t;
  $('#tabJobs').classList.toggle('on', t === 'jobs');
  $('#tabPend').classList.toggle('on', t === 'pend');
  $('#searchbar').style.display = t === 'jobs' ? 'flex' : 'none';
  $('#pbar').style.display = (t === 'pend' && PEND.length) ? 'flex' : 'none';
  $('#lnote').innerHTML = '';
  if (t === 'jobs') { listSig = ''; load(); }
  else drawPendList();
  $('#jpane').innerHTML = `<div class="empty">${t === 'jobs'
    ? '左边挑一个岗位,这里显示清洗后的全部内容。'
    : '这些是插件存进来的**页面原文**,还没让 AI 清洗。<br>点一条看原文;勾选后点「提取」。'}</div>`;
  $('#jpane .empty').innerHTML = $('#jpane .empty').innerHTML.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
}
$('#tabJobs').onclick = () => setTab('jobs');
$('#tabPend').onclick = () => setTab('pend');

/* 待提取列表:和岗位列表长一样,复用同一个滚动区 */
function drawPendList() {
  const KIND = {detail: '岗位详情', list: '岗位列表', other: '不像岗位页'};
  $('#jlist').innerHTML = PEND.length
    ? PEND.map(i => `<div class="jrow" data-key="${esc(i.key)}">
        <div class="t">
          <input type="checkbox" data-k="${esc(i.key)}"${i.kind === 'other' ? '' : ' checked'}
            onclick="event.stopPropagation()" style="flex:0 0 auto">
          <span>${esc(i.title || '(无标题)')}</span></div>
        <div class="m">${KIND[i.kind] || esc(i.kind || '?')} · ${i.chars || 0} 字 · ${
          esc((i.at || '').replace('T', ' ').slice(5, 16))}</div>
      </div>`).join('')
    : '<div class="empty">队列是空的 —— 开着插件侧边栏浏览 BOSS,岗位页会自动存进来。</div>';
  $('#jlist').querySelectorAll('.jrow[data-key]').forEach(el => el.onclick = () => showPending(el.dataset.key));
  $('#jlist').querySelectorAll('input[data-k]').forEach(e => e.onchange = () => {
    $('#ckall').checked = selKeys().length === PEND.length;
    updEta();
  });
  $('#pbar').style.display = PEND.length ? 'flex' : 'none';
  updEta();
}

/* 右侧看待提取的原文 —— 提取前能自己判断这页值不值得花调用 */
function showPending(key) {
  const it = PEND.find(x => x.key === key);
  if (!it) return;
  const KIND = {detail: '岗位详情', list: '岗位列表', other: '不像岗位页'};
  $('#jpane').innerHTML = `<div class="jp">
    <h3>${esc(it.title || '(无标题)')}</h3>
    <div class="kv">
      <div><b>${KIND[it.kind] || esc(it.kind)}</b><span>判定</span></div>
      <div><b class="acc">${it.chars || 0}</b><span>字数</span></div>
      <div><b>${esc((it.at || '').replace('T', ' ').slice(5, 16))}</b><span>存入时间</span></div>
    </div>
    <div class="sec">页面原文(还没清洗 —— 提取后才有结构和特征)</div>
    <div class="jd" id="ptext">读取中…</div>
    ${it.url ? `<div class="jfoot"><a class="lk" href="${esc(it.url)}" target="_blank" rel="noreferrer">看原页 ↗</a></div>` : ''}
  </div>`;
  fetch('/api/boss/pending/' + encodeURIComponent(key)).then(r => r.json()).then(d => {
    const box = $('#ptext');
    if (box) box.textContent = d.text || d.error || '(没有正文)';
  }).catch(() => { const b = $('#ptext'); if (b) b.textContent = '读不到本地服务'; });
}

function selKeys() {
  return [...document.querySelectorAll('#jlist input[type=checkbox]:checked')]
    .map(e => e.dataset.k);
}

async function updEta() {
  const keys = selKeys();
  const btn = $('#extract');
  btn.textContent = keys.length ? `提取勾选的 ${keys.length} 页` : '先勾选';
  btn.disabled = !keys.length;
  if (!keys.length) { $('#eta').textContent = ''; return; }
  try {
    const d = await (await fetch('/api/boss/extract/estimate?keys='
      + encodeURIComponent(keys.join(',')))).json();
    $('#eta').innerHTML = `${d.pages} 页 → ${d.calls} 次调用 · 预计 <b>${
      d.est_s < 60 ? Math.ceil(d.est_s) + ' 秒' : (d.est_s / 60).toFixed(1) + ' 分钟'}</b>`
      + `(按最近每次 ${d.per_call_s}s 估)`;
  } catch (e) { $('#eta').textContent = ''; }
}

function drawPend(items) {
  PEND = items || [];
  $('#nPend').textContent = PEND.length ? `(${PEND.length})` : '';
  if (TAB === 'pend') drawPendList();
}

$('#ckall').onchange = e => {
  document.querySelectorAll('#jlist input[type=checkbox]').forEach(c => c.checked = e.target.checked);
  updEta();
};

$('#extract').onclick = async () => {
  const keys = selKeys();
  if (!keys.length) return;
  const b = $('#extract'); const old = b.textContent;
  b.disabled = true; b.textContent = '提取中…';
  msg('#msg', '');
  try {
    const d = await (await fetch('/api/boss/extract', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({keys}),
    })).json();
    if (d.error) msg('#msg', d.error, 'bad');
    else msg('#msg', `新增 ${d.extracted} 个岗位`
      + (d.updated ? `,更新 ${d.updated} 个` : '')
      + ` · 用了 ${d.ai_calls} 次 AI 调用`
      + (d.index_started ? ' · **向量同步已自动开始**(上面「向量」那格过会儿会动)' : '')
      + (d.failed?.length ? ` · ${d.failed.length} 批失败:${d.failed[0]}` : ''),
      d.extracted || d.updated ? 'ok' : '');
  } catch (e) { msg('#msg', '出错:' + e.message, 'bad'); }
  b.textContent = old; load();
};

/* ══ 总览 ═══════════════════════════════════════════════ */
async function load() {
  let st, jb, pd, ix;
  try {
    [st, jb, pd, ix] = await Promise.all([
      fetch('/api/boss/stats').then(r => r.json()),
      fetch('/api/boss/jobs?limit=120').then(r => r.json()),
      fetch('/api/boss/pending?limit=100').then(r => r.json()),
      fetch('/api/boss/index/status').then(r => r.json()),
    ]);
  } catch (e) {
    $('#jlist').innerHTML = '<div class="empty">读不到本地服务 —— 在项目目录跑 ./boss.sh</div>';
    return;
  }
  $('#db').textContent = st.db || '';

  const a = st.ai || {};
  const pill = $('#ai');
  pill.className = 'pill' + (a.state === 'ok' ? ' have' : '');
  pill.textContent = 'AI ' + (a.label || '?') + (a.provider ? ' · ' + a.provider : '');
  pill.title = (a.error || '') + ' 点开配置';

  const pend = pd.total || 0;
  const vec = ix && !ix.error
    ? (ix.syncing ? '同步中…' : `${ix.vectors || 0}`)
    : '?';
  $('#facts').innerHTML = `
    <div class="fact"><b>${st.jobs || 0}</b><span>已入库岗位</span></div>
    <div class="fact${st.jd_have ? ' on' : ''}"><b>${st.jd_have || 0}</b><span>有职位描述</span></div>
    <div class="fact${pend ? ' warn' : ''}"><b>${pend}</b><span>待提取页面</span></div>
    <div class="fact${ix?.in_sync ? ' on' : ''}" title="${esc(ix?.log_tail || '')}"><b>${vec}</b><span>向量${
      ix && !ix.error && !ix.in_sync && !ix.syncing ? `(差 ${ix.pending || 0})` : ''}</span></div>`;
  // 同步中就把子进程干到哪儿了显示出来 —— 首次要下 2.2GB 模型,
  // 光一个「同步中…」会让人以为卡死
  if (ix?.syncing) {
    const t = ix.log_tail || '';
    msg('#msg', /%\|/.test(t) || /Downloading|fetch/i.test(t)
      ? `首次要下载向量模型(约 2.2GB,存 ~/.cache/huggingface,只下一次)…  ${t.slice(-60)}`
      : (t ? `向量同步中:${t.slice(-70)}` : '向量同步中…'), '');
  }

  $('#nJobs').textContent = st.jobs ? `(${st.jobs})` : '';
  // 过滤中不动列表(会把过滤结果冲掉);普通模式按内容指纹,变了才重画
  if (TAB === 'jobs' && !FILTERED) {
    const items = jb.items || [];
    const sig = items.map(j => j.job_id + ':' + (j.fit ?? '')).join('|');
    if (sig !== listSig) {
      listSig = sig;
      drawList(items, items.length >= 120
        ? `最近 120 个(共 ${jb.total});更早的用上面的过滤找` : '');
    }
  }

  const psig = (pd.items || []).map(i => i.key).join('|');
  if (psig !== (drawPend._sig || '')) { drawPend._sig = psig; drawPend(pd.items); }
}

/* ══ AI 设置卡 ══════════════════════════════════════════ */
let AIP = [];
$('#ai').onclick = async () => {
  const card = $('#aicard');
  if (card.style.display !== 'none') { card.style.display = 'none'; return; }
  card.style.display = 'block';
  const d = await (await fetch('/api/boss/llm/providers')).json();
  AIP = d.providers || [];
  $('#aprov').innerHTML = AIP.map(p =>
    `<option value="${esc(p.id)}"${p.id === d.current.provider ? ' selected' : ''}>${esc(p.label)}</option>`).join('');
  $('#amodel').value = d.current.model || '';
  $('#afast').value = d.current.fast_model || '';
  $('#akey').value = '';
  // ⚠️ 输入框永远是空的(只回尾四位,不回明文)—— 所以必须把「怎么改」写在
  // 看得见的标签上。只写 placeholder 的话,用户看到空框会以为改不了。
  $('#akeylab').innerHTML = d.current.key_set
    ? `API Key · 当前 <b style="color:var(--ok)">${esc(d.current.key_hint)}</b>` +
      ` —— <b>要换就把新 key 粘进来</b>,留空则不动`
    : `API Key · <b style="color:var(--warn-text)">还没配</b> —— 粘进来即可`;
  $('#akey').placeholder = d.current.key_set ? '粘新 key 覆盖(留空 = 不改)' : '粘这家的 API Key';
  msg('#amsg', d.status.state === 'ok' ? '' : `当前状态:${d.status.label}`, '');
};
$('#aprov').onchange = () => {
  const p = AIP.find(x => x.id === $('#aprov').value);
  if (p) { $('#amodel').value = ''; $('#amodel').placeholder = '默认 ' + p.model; }
};
$('#asave').onclick = async () => {
  const body = {LLM_PROVIDER: $('#aprov').value,
                LLM_MODEL: $('#amodel').value.trim(),
                LLM_MODEL_FAST: $('#afast').value.trim()};
  if ($('#akey').value.trim()) body.LLM_API_KEY = $('#akey').value.trim();
  const d = await (await fetch('/api/boss/settings', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)})).json();
  if (d.error) { msg('#amsg', d.error, 'bad'); return; }
  $('#akey').value = '';
  // 换完把新的尾四位读回来显示 —— 不然用户不知道到底换没换
  const back = await (await fetch('/api/boss/llm/providers')).json();
  $('#akeylab').innerHTML = `API Key · 当前 <b style="color:var(--ok)">${
    esc(back.current.key_hint || '未配')}</b> —— <b>要换就把新 key 粘进来</b>,留空则不动`;
  msg('#amsg', `已保存(${d.saved.join(' / ')})· key 现在是 ${
    back.current.key_hint || '未配'} —— 点「测一下」验证`, 'ok');
  load();
};
$('#atest').onclick = async () => {
  const b = $('#atest'); b.disabled = true; b.textContent = '测试中…';
  const d = await (await fetch('/api/boss/llm/test', {method: 'POST'})).json();
  b.disabled = false; b.textContent = '测一下';
  // 后端 probe() 不返回耗时,别读一个不存在的字段(以前显示成「?s」)
  msg('#amsg', d.ok ? `✓ 通了 · ${esc(d.model)} @ ${esc(d.provider)}`
    : `✗ ${esc(d.error || d.hint || JSON.stringify(d).slice(0, 140))}`, d.ok ? 'ok' : 'bad');
  load();
};

load(); setInterval(load, 5000);
</script>
